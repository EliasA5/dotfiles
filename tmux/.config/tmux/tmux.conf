# key bindings

# set leader to ctrl+space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# set -g prefix C-b
# bind C-b send-prefix

# leader+m for maximizing/minimizing pane
unbind z
bind m resize-pane -Z

unbind M-1
unbind M-2
unbind Space

# use alt-arrow keys without prefix key to switch panes
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

# shift arrow to switch windows
bind -n M-h  previous-window
bind -n M-l next-window
bind -n C-Left  previous-window
bind -n C-Right next-window

# reorder tabs
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# default yes on closing window
bind-key -T prefix x confirm-before -y -p "kill-pane #P? (y/n)" kill-pane
bind-key -T prefix & confirm-before -y -p "kill-window #W? (y/n)" kill-window

# split windows using v for vertical and h for horizonal
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}" -p 40

# to stop tmux from scrolling down after copying
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# set configurations

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-position top

set -s set-clipboard external

# this might need to be changed based on ur terminal
set -as terminal-features ",xterm-kitty:clipboard"
set -g allow-passthrough on
set-window-option -g mode-keys vi

set-option -g mouse on

# to reduce the delay on hitting escape https://unix.stackexchange.com/questions/608142/whats-the-effect-of-escape-time-in-tmux
set-option -s escape-time 20

# for nvim navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|ssh|lazygit)(diff)?$'"

# plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin 'omerxx/tmux-floax'

# theme
set -g @plugin "catppuccin/tmux"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"

# catppuccin options
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_date_time_text "%d-%m-%Y %H:%M:%S"

set -ogq "@catppuccin_load_text" " #{l:#(uptime | awk '{split(substr($0, index($0, \"load\")), a, \":\"); print a[2]\}}' | tr -d ' ' | tr ',' ' ')"

# load catppuccin after defining the variables and before loading the status bar config
run '$XDG_CONFIG_HOME/tmux/plugins/tmux/catppuccin.tmux'

# status bar config
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_load}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{?#{#{==:#{E:@battery_exists},true}},#{E:@catppuccin_status_battery},}"

# resurrection options
set -g @resurrect-strategy-nvim "session"
set -g @continuum-restore "on"

# floating terminal
set -g @floax-bind 't'

# run tpm, this should be the last line
run "$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm"
